# ── Render Blueprint — ComplyBD platform ──────────────────────────────
# Full app on one Web Service (Next.js frontend + API routes + SQLite on a
# persistent disk). Deploy via: Render Dashboard → New → Blueprint → point
# at the GitHub repo this file ships in. See DEPLOY.md for the full guide.
services:
  - type: web
    name: complybd-platform
    runtime: node
    plan: starter
    healthCheckPath: /api/dashboard
    # Install with bun, push the Prisma schema to the SQLite file on the
    # persistent disk, then run the standalone Next production build.
    # The build script itself generates the correct Prisma client (it reads
    # DATABASE_URL: sqlite here, postgres://… for the Postgres topology), so
    # even a bare `npm run build` can no longer fail with
    # "Cannot find module '.prisma/client/default'".
    buildCommand: bun install && bunx prisma generate && bunx prisma db push && npm run build
    # Boots the standalone server via the package.json "start" script, which
    # runs `node .next/standalone/server.js` — plain Node, no bun required at
    # runtime. PORT / HOSTNAME are picked up from Render's environment.
    startCommand: npm run start
    disk:
      name: complybd-data
      mountPath: /opt/complybd-data
      sizeGB: 1
    envVars:
      # Set this at deploy time to a file ON the persistent disk, e.g.
      #   file:/opt/complybd-data/prod.db
      # Render's ephemeral filesystem wipes SQLite on every redeploy, so the
      # database MUST live on the mounted disk (see DEPLOY.md).
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Real authentication (NextAuth). Set NEXTAUTH_SECRET at deploy time:
      #   openssl rand -hex 32
      - key: NEXTAUTH_URL
        sync: false # the deployed origin, e.g. https://complybd-platform.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
      # Optional SSO (uncomment + set at deploy time to activate the provider):
      # - key: GOOGLE_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_CLIENT_SECRET
      #   sync: false
      # Optional alerting webhook:
      # - key: ALERT_WEBHOOK_URL
      #   sync: false
